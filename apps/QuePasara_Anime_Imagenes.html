function fullProfile(job){
 const p=profiles[job.name];
 return `<div class="profile-details"><h2>🌟 ¿En qué consiste este trabajo?</h2><p>${esc(p.summary)}</p><h2>🧩 Tareas que podrías realizar</h2><ul>${p.tasks.map(task=>`<li>${esc(task)}.</li>`).join('')}</ul><h2>🏡 ¿Dónde puede trabajar?</h2><p>${esc(p.where)}</p><h2>💪 Habilidades de esta profesión</h2><p>${esc(p.skills)}</p><h2>🎒 ¿Qué puedo estudiar?</h2><p>${esc(p.study)}</p><h2>✨ Lo gratificante y lo exigente</h2><p><strong>Lo gratificante:</strong> ${esc(p.reward)}</p><p><strong>El reto:</strong> ${esc(p.challenge)}</p><div class="career-try"><h2>🧭 Una forma de explorarlo</h2><p>${esc(p.tryIt)}</p></div><details class="career-sources"><summary>Consultar estudios y requisitos en fuentes oficiales</summary><p class="small">Orientación para España. Comprueba la oferta y los requisitos del puesto en tu comunidad antes de elegir un itinerario.</p><ul>${p.sources.map(source=>`<li><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)} ↗</a></li>`).join('')}</ul><p class="small muted">Contenido editorial revisado el 13 de noviembre de 2026. Las fichas describen ejemplos de tareas; las funciones concretas dependen del puesto.</p></details><div class="warning">Esta ficha te ayuda a explorar una posibilidad. No tienes que decidir tu futuro ahora.</div></div>`;
}
function catalog(){const categories=['Todas',...new Set(jobs.map(j=>j.category||'Profesiones iniciales'))];view(`<section class="panel"><div class="tag">Enciclopedia profesional</div><h1>Explora todas las profesiones 🌎</h1><p>Busca una profesión o descubre algo nuevo. ${jobs.length} profesiones en esta versión. Las rutas educativas son orientativas.</p><div class="row"><input id="searchJobs" type="search" placeholder="Buscar profesión..." aria-label="Buscar profesión" style="flex:2;min-width:180px"><select id="filterJobs" aria-label="Filtrar por familia">${categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><p id="jobCount" class="small"></p><div class="grid" id="catalogGrid"></div>${actions('<button class="secondary" id="catalogBack">← Volver al inicio</button>')}</section>`);document.getElementById('catalogBack').onclick=()=>{state.screen='welcome';render()};const draw=()=>{let q=document.getElementById('searchJobs').value.toLocaleLowerCase('es'),c=document.getElementById('filterJobs').value;let matches=jobs.filter(j=>(c==='Todas'||(j.category||'Profesiones iniciales')===c)&&j.name.toLocaleLowerCase('es').includes(q));document.getElementById('jobCount').textContent=matches.length+' profesiones encontradas';document.getElementById('catalogGrid').innerHTML=matches.map(j=>`<div class="tile"><h3>${esc(j.name)}</h3><p class="small">${esc(professionDescriptions[j.name]||j.desc)}</p><button data-catalog-job="${j.id}">Ver profesión →</button></div>`).join('')||'<p>No encontramos ninguna. Prueba con otra palabra.</p>';document.querySelectorAll('[data-catalog-job]').forEach(b=>b.onclick=()=>{state.job=+b.dataset.catalogJob;state.returnTo='catalog';state.screen='job';render()})};document.getElementById('searchJobs').oninput=draw;document.getElementById('filterJobs').onchange=draw;draw()}
const worldColors={ciencia:'#267c83',arte:'#8b4b9a',tecnologia:'#3767a4',personas:'#ad5877',aventura:'#38835c',organizacion:'#97703c'};
function mapHTML(active=-1,completed=0){return `<div class="world-map"><div class="map-title">🗺️ Mapa de los seis mundos</div><div class="map-grid">${worlds.map((w,i)=>{let idx=state.order?.indexOf(w.id)??-1;let done=idx>=0&&idx<completed;let current=idx===active;return `<div class="map-node ${done?'completed':''} ${current?'current':''}" style="--world-color:${worldColors[w.id]}"><span class="map-emoji">${w.icon}</span><span class="map-label">${w.name}</span>${done?'<span class="map-stamp" aria-label="Completado">✓</span>':''}</div>`}).join('')}</div><p class="small muted">✨ Los mundos aparecen por sorpresa y puedes volver a ellos para descubrir más.</p></div>`}
const KEY='quepasara_alexia_adaptativa_v2';
const MIN=12,MAX=30;
const app=document.getElementById('app'),status=document.getElementById('status');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return {screen:'welcome',age:12,avatar:'🦊',photo:null,animeStyle:'normal',manga:null,mangaOptions:{},order:[],asked:[],current:null,answers:{},history:[],stable:0,job:0,finished:false}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh();if(!state||!Array.isArray(state.asked)||!Array.isArray(state.order))state=fresh()}catch{state=fresh()}
let cameraStream=null;
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
function explorerAvatar(){return state.photo?`<span class="anime-frame anime-${state.animeStyle||'normal'}"><img class="photo-avatar" src="${state.manga||state.photo}" alt="Tu personaje explorador"></span>`:state.avatar}
function setExplorerPhoto(source){const c=document.createElement('canvas');c.width=240;c.height=240;const ctx=c.getContext('2d');const w=source.videoWidth||source.width,h=source.videoHeight||source.height;const side=Math.min(w,h);ctx.drawImage(source,(w-side)/2,(h-side)/2,side,side,0,0,240,240);state.photo=c.toDataURL('image/jpeg',.72);stopCamera();render()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{const notice=document.getElementById('saveStatus');if(notice)notice.textContent='No se pudo guardar en este navegador. Mantén esta pestaña abierta para continuar.';}}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function actions(x){return `<div class="nav">${x}</div>`}
let lastView=null;
function view(html){const viewKey=state.screen+':'+(state.current||'')+':'+(state.screen==='job'?state.job:'');const changed=lastView!==viewKey;lastView=viewKey;document.body.dataset.screen=state.screen;app.innerHTML=html;if(changed){window.scrollTo(0,0);const heading=app.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}status.textContent=state.screen==='quiz'?`Pregunta ${state.asked.length+1} · máximo ${MAX}`:state.screen==='results'?'Tu mapa de profesiones':'Explora tu futuro';save()}
function countWorld(id){return state.asked.filter(k=>k.startsWith(id+'_')).length}
function scoreTags(){let scores=Object.fromEntries(interests.map(x=>[x,0]));for(const k of state.asked){const [id,n]=k.split('_'),a=state.answers[k];if(a!==undefined){let t=optionTags[id][a];scores[t[0]]+=2;scores[t[1]]+=1}}return scores}
function ranking(){let scores=scoreTags(),max=Math.max(1,...Object.values(scores));return jobs.map(job=>{let value=job.tags.reduce((a,t)=>a+scores[t],0)/job.tags.length;return {job,pct:Math.min(99,Math.max(5,Math.round(100*value/max)))}}).sort((a,b)=>b.pct-a.pct||a.job.name.localeCompare(b.job.name))}
function chooseNext(){let available=[];for(const id of state.order){for(let i=0;i<prompts[id].length;i++){let key=id+'_'+i;if(!state.asked.includes(key))available.push({key,id,i})}}if(!available.length)return null;
// Primero: 2 preguntas por mundo, en orden sorpresa, para no ignorar ningún interés.
const under=state.order.find(id=>countWorld(id)<2);if(under)return available.find(x=>x.id===under).key;
// Después: explorar áreas que distingan las profesiones líderes, manteniendo variedad.
const leaders=ranking().slice(0,5),top=new Set(leaders.flatMap(x=>x.job.tags));const scores=scoreTags();let best=-Infinity,picks=[];
for(const x of available){const tags=optionTags[x.id].flat();const relevant=tags.filter(t=>top.has(t)).length;const novelty=tags.reduce((v,t)=>v+1/(1+scores[t]),0);const value=relevant*1.7+novelty*.7-countWorld(x.id)*.85;if(value>best+.00001){best=value;picks=[x]}else if(Math.abs(value-best)<.00001)picks.push(x)}return picks[Math.floor(Math.random()*picks.length)].key}
function recordAnswer(){const k=state.current;if(k==null||state.answers[k]===undefined)return;state.asked.push(k);let top=ranking().slice(0,3).map(x=>x.job.id).join(',');state.history.push(top);let last=state.history.slice(-4);state.stable=last.length===4&&last.every(x=>x===last[0])?4:0;state.current=null}
function eligible(){return state.asked.length>=MIN&&state.order.every(id=>countWorld(id)>=2)&&state.stable===4}
function advance(){if(state.screen!=='quiz'||state.current==null||state.answers[state.current]===undefined)return;recordAnswer();const next=chooseNext();if(state.asked.length>=MAX||!next){state.screen='results';state.finished=true}else if(eligible()&&state.asked.length>=(state.checkpointAt||0)+5){state.checkpointAt=state.asked.length;state.screen='checkpoint'}else{state.current=next;state.screen='quiz'}render()}
function bindProfessionLinks(returnTo){document.querySelectorAll('[data-job]').forEach(button=>button.onclick=()=>{state.job=+button.dataset.job;state.returnTo=returnTo;state.screen='job';render();});}
