function chooseNext(){let available=[];for(const id of state.order){for(let i=0;i<prompts[id].length;i++){let key=id+'_'+i;if(!state.asked.includes(key))available.push({key,id,i})}}if(!available.length)return null;

view(`<section class="panel"><div class="tag">Prepara tu explorador</div><h2>¿Quién te acompañará? 🧭</h2><p>Puedes elegir un personaje o hacerte una foto. La foto permanece en tu dispositivo, salvo que pulses «Crear dibujo manga» y autorices enviarla al servicio de IA. Pide permiso a un adulto antes de hacerlo.</p><h3>Elige tu personaje</h3><div class="choices">${avatarButtons}</div><div class="camera-box"><h3>📷 O usa tu propia foto</h3><p class="camera-help">La cámara solo se encenderá si pulsas el botón y aceptas el permiso. También puedes elegir una foto que ya tengas.</p><div class="camera-actions"><button id="openCamera" type="button">📷 Abrir cámara</button><button class="secondary" id="chooseFile" type="button">🖼️ Elegir foto</button><input id="photoFile" type="file" accept="image/*" style="display:none" aria-label="Elegir foto del dispositivo"></div><div id="cameraArea" class="hidden"><video id="cameraVideo" class="camera-video" autoplay muted playsinline></video><div class="camera-actions"><button id="takePhoto" type="button">Hacer foto</button><button class="secondary" id="closeCamera" type="button">Cerrar cámara</button></div></div><p id="cameraMessage" class="camera-help" role="status"></p>${state.photo?`<div class="photo-preview"><img class="photo-avatar" src="${state.photo}" alt="Tu foto de explorador"><button class="secondary" id="removePhoto" type="button">Quitar mi foto</button></div><h3>🌸 Crea tu avatar manga</h3><p class="camera-help">Pulsa «Crear los 4 dibujos manga» y después elige tu favorito. Con permiso de un adulto, la fotografía se enviará al servicio de IA para crear un dibujo nuevo. Esta función requiere iniciar el servidor incluido y configurar una clave de API.</p><div class="anime-choices">${[["normal","🌸 Manga normal"],["fantastico","✨ Manga fantástico"],["medieval","🏰 Manga medieval"],["aventurero","🧭 Manga aventurero"]].map(([id,label])=>`<button type="button" class="choice anime-option ${state.animeStyle===id?"selected":""}" data-anime="${id}"><span class="anime-frame anime-${id}"><span style="font-size:40px">${({normal:"🌸",fantastico:"✨",medieval:"🏰",aventurero:"🧭"})[id]}</span></span><span>${label}</span></button>`).join("")}</div><button id="makeManga" type="button">🎨 Crear los 4 dibujos manga</button><p id="mangaMessage" class="camera-help" role="status"></p>${Object.keys(state.mangaOptions||{}).length?`<h3>Elige tu dibujo favorito</h3><div class="anime-choices">${[['normal','Normal'],['fantastico','Fantástico'],['medieval','Medieval'],['aventurero','Aventurero']].map(([id,label])=>`<button type="button" class="choice anime-option ${state.animeStyle===id?'selected':''}" data-generated="${id}"><img class="manga-result" src="${state.mangaOptions[id]}" alt="Avatar manga ${label}"><span>${label}</span></button>`).join('')}</div>`:""}`:''}</div><label>Edad aproximada <select id="age">${[10,11,12,13,14,15].map(n=>`<option ${state.age===n?'selected':''}>${n}</option>`).join('')}</select></label>${actions('<button id="begin">Descubrir mi primer mundo →</button>')}</section>`);
document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{stopCamera();state.avatar=b.dataset.avatar;state.photo=null;state.manga=null;state.mangaOptions={};render()});
document.querySelectorAll('[data-generated]').forEach(b=>b.onclick=()=>{state.animeStyle=b.dataset.generated;state.manga=state.mangaOptions[state.animeStyle];render()});
document.querySelectorAll('[data-anime]').forEach(b=>b.onclick=()=>{state.animeStyle=b.dataset.anime;state.manga=(state.mangaOptions||{})[state.animeStyle]||null;render()});
document.getElementById('age').onchange=e=>{state.age=+e.target.value;save()};
document.getElementById('begin').onclick=()=>{stopCamera();let age=state.age,avatar=state.avatar,photo=state.photo,animeStyle=state.animeStyle,manga=state.manga,mangaOptions=state.mangaOptions;state=fresh();state.age=age;state.avatar=avatar;state.photo=photo;state.animeStyle=animeStyle;state.manga=manga;state.mangaOptions=mangaOptions;state.order=shuffle(worlds.map(w=>w.id));state.current=chooseNext();state.screen='reveal';render()};
document.getElementById('chooseFile').onclick=()=>document.getElementById('photoFile').click();
document.getElementById('photoFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Elige una imagen.');return}try{const img=await createImageBitmap(f);setExplorerPhoto(img);img.close()}catch{alert('No se pudo abrir esa imagen. Prueba con otra.')}};
document.getElementById('openCamera').onclick=async()=>{const msg=document.getElementById('cameraMessage');if(!navigator.mediaDevices?.getUserMedia){msg.textContent='Este navegador no permite usar la cámara desde aquí. Puedes elegir una foto de tu dispositivo.';return}try{stopCamera();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});document.getElementById('cameraVideo').srcObject=cameraStream;document.getElementById('cameraArea').classList.remove('hidden');msg.textContent='La cámara está encendida. Pulsa «Hacer foto» cuando quieras.'}catch{msg.textContent='No se pudo abrir la cámara. Comprueba los permisos o utiliza «Elegir foto».'}};
document.getElementById('takePhoto').onclick=()=>{const video=document.getElementById('cameraVideo');if(!video.videoWidth){document.getElementById('cameraMessage').textContent='Espera un momento a que aparezca la imagen.';return}setExplorerPhoto(video)};
document.getElementById('closeCamera').onclick=()=>{stopCamera();document.getElementById('cameraArea').classList.add('hidden')};
if(state.photo)document.getElementById('makeManga').onclick=async()=>{
 const msg=document.getElementById('mangaMessage');
 if(!confirm('¿Tienes permiso de un adulto para enviar tu foto a un servicio de inteligencia artificial y convertirla en dibujo manga?'))return;
 const btn=document.getElementById('makeManga');btn.disabled=true;msg.textContent='Creando tu dibujo manga… Puede tardar un poco.';
 try {const res=await fetch('/api/manga',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photo:state.photo,styles:['normal','fantastico','medieval','aventurero']})});const data=await res.json();if(!res.ok)throw new Error(data.error||'No se pudo crear el avatar');state.mangaOptions=Object.fromEntries(Object.entries(data.images).map(([k,v])=>[k,'data:image/png;base64,'+v]));state.manga=state.mangaOptions[state.animeStyle];render();}
 catch(e){btn.disabled=false;msg.textContent='No se ha generado el dibujo: '+e.message+' (abre la aplicación con el servidor incluido).';}
};
if(state.photo)document.getElementById('removePhoto').onclick=()=>{stopCamera();state.photo=null;state.manga=null;state.mangaOptions={};render()};return}
if(state.screen==='reveal'){if(!state.current)state.current=chooseNext();const id=state.current.split('_')[0],w=worlds.find(x=>x.id===id),index=state.order.indexOf(id);view(`<section class="panel"><div class="tag">Portal sorpresa · ${state.asked.length} preguntas completadas</div><div class="quest-intro"><div class="quest-art"><div class="quest-orbit"></div><div class="quest-planet">${w.icon}</div></div><div><span class="world-badge">✨ Nuevo desafío</span><h1>¡${w.name}!</h1><p>${w.desc}</p></div></div>${mapHTML(index,0)}<p>La brújula ha elegido una pregunta para ti. Puede que vuelvas a este mundo más adelante.</p>${actions('<button id="go">¡Entrar al desafío! →</button>')}</section>`);document.getElementById('go').onclick=()=>{state.screen='quiz';render()};return}

if(state.screen==='quiz'){if(!state.current)state.current=chooseNext();let key=state.current,[id,n]=key.split('_'),w=worlds.find(x=>x.id===id),q=prompts[id][+n],chosen=state.answers[key],pct=100*state.asked.length/MAX;view(`<section class="panel"><div class="row space"><span class="tag">${w.icon} ${w.name}</span><span class="pill">Pregunta ${state.asked.length+1} · máximo ${MAX}</span></div><div class="progress" role="progressbar" aria-valuenow="${state.asked.length}" aria-valuemin="0" aria-valuemax="${MAX}"><div style="width:${pct}%"></div></div><div class="world-badge">${explorerAvatar()} Preguntas que se adaptan a ti</div><h2 class="question">${esc(q[0])}</h2><p>Elige lo que más te guste. No hay respuestas buenas ni malas.</p><div class="choices scene-grid">${q.slice(1).map((a,i)=>`<button class="choice scene-choice ${chosen===i?'selected':''}" data-opt="${i}" aria-pressed="${chosen===i}"><img class="scene-art" src="${illustratedScene(id,i)}" alt="Ilustración de ${esc(a)}"><span class="scene-label">${esc(a)}</span></button>`).join('')}</div>${actions(`<button id="next" ${chosen===undefined?'disabled':''}>Continuar →</button><button class="secondary" id="save">Guardar progreso</button>`)}</section>`);document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{state.answers[key]=+b.dataset.opt;render()});document.getElementById('next').onclick=advance;document.getElementById('save').onclick=()=>{save();alert('¡Progreso guardado en este navegador!')};return}
if(state.screen==='checkpoint'){const leaders=ranking().slice(0,3);view(`<section class="panel"><div class="tag">✨ ¡La brújula ha encontrado pistas!</div><h1>¿Quieres ver tus resultados?</h1><p>Has respondido ${state.asked.length} preguntas y hemos explorado los seis mundos. Las primeras profesiones recomendadas llevan varias preguntas manteniéndose en el mismo orden.</p><div class="grid">${leaders.map((r,i)=>`<div class="tile"><span class="tag">#${i+1}</span><h3>${esc(r.job.name)}</h3><div class="score">${r.pct}%</div></div>`).join('')}</div><div class="warning">Estas son afinidades orientativas, no una predicción de tu futuro. Más preguntas pueden descubrir intereses nuevos.</div>${actions('<button id="finish">🎉 Ver mis resultados</button><button class="secondary" id="more">🔎 Quiero descubrir más</button>')}</section>`);document.getElementById('finish').onclick=()=>{state.finished=true;state.screen='results';render()};document.getElementById('more').onclick=()=>{state.current=chooseNext();state.screen='reveal';render()};return}
if(state.screen==='results'){const ranked=ranking(),total=state.asked.length;view(`<section class="panel"><div class="tag">¡Aventura completada! 🎉</div><div class="confetti" aria-hidden="true">🎉 ⭐ 🎊</div><h1>Tus profesiones por descubrir</h1>${mapHTML(-1,0)}<p>Has respondido <strong>${total} preguntas</strong>. Estos porcentajes son <strong>índices orientativos de afinidad</strong>, no probabilidades científicas de que te guste una profesión.</p><div class="warning">💛 Tus gustos pueden cambiar. ¡Explora también profesiones con puntuación baja!</div><div class="grid">${ranked.slice(0,10).map((r,i)=>`<div class="tile"><span class="tag">#${i+1}</span><h3>${esc(r.job.name)}</h3><div class="score">${r.pct}% de afinidad</div><div class="progress"><div style="width:${r.pct}%"></div></div><p class="small">${esc(r.job.desc)}</p><button data-job="${r.job.id}">Explorar profesión →</button></div>`).join('')}</div><h2>Otras profesiones</h2><div class="grid">${ranked.slice(10).map(r=>`<div class="tile"><h3>${esc(r.job.name)}</h3><p>${r.pct}% de afinidad</p><button class="secondary" data-job="${r.job.id}">Ver ficha</button></div>`).join('')}</div>${actions(`${total<MAX?'<button id="more">🔎 Responder más preguntas</button>':''}<button class="secondary" id="restart">Nueva aventura</button><button class="secondary" id="print">Imprimir resultados</button>`)}</section>`);document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{state.job=+b.dataset.job;state.returnTo='results';state.screen='job';render()});let more=document.getElementById('more');if(more)more.onclick=()=>{state.current=chooseNext();state.screen='reveal';render()};document.getElementById('restart').onclick=()=>{if(confirm('¿Empezar otra aventura? Se sustituirán las respuestas guardadas.')){state=fresh();render()}};document.getElementById('print').onclick=()=>window.print();return}
if(state.screen==='job'){let job=jobs[state.job],rank=ranking().find(x=>x.job.id===job.id);view(`<section class="panel"><div class="tag">Ficha profesional</div><h1>${esc(job.name)}</h1><div class="score">${rank.pct}% de afinidad orientativa</div>${fullProfile(job)}${actions('<button id="backresults">← Volver</button>')}</section>`);document.getElementById('backresults').onclick=()=>{state.screen=state.returnTo==='catalog'?'catalog':'results';render()};return}}

</script></body></html>
