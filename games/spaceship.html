<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <title>finvernot - Aventura Espacial</title>    <style>        body {            margin: 0;            background: black;            color: white;            font-family: sans-serif;            overflow: hidden;        }        canvas {            display: block;            margin: 0 auto;            background: #000011;            border: 2px solid white;        }        #scoreboard {            position: absolute;            top: 10px;            left: 50%;            transform: translateX(-50%);            font-size: 20px;        }    </style><link rel="stylesheet" href="../assets/navigation.css">
</head><body>
<a class="invernot-home" href="../index.html" aria-label="Volver al índice de la Familia Invernot">← Volver al inicio</a>
<div id="scoreboard">Puntuación: 0 | Nivel: 1</div><canvas id="gameCanvas" width="400" height="600"></canvas><script>    const canvas = document.getElementById('gameCanvas');    const ctx = canvas.getContext('2d');    const nave = { x: 180, y: 520, width: 40, height: 40, speed: 5 };    const disparos = [];    const asteroides = [];    let score = 0;    let nivel = 1;    let gameOver = false;    // Sonido simple    const sonidoDisparo = new AudioContext();    function beep(frequency, duration) {        const oscillator = sonidoDisparo.createOscillator();        oscillator.type = 'square';        oscillator.frequency.setValueAtTime(frequency, sonidoDisparo.currentTime);        oscillator.connect(sonidoDisparo.destination);        oscillator.start();        oscillator.stop(sonidoDisparo.currentTime + duration / 1000);    }    const keys = {};    document.addEventListener('keydown', e => keys[e.key] = true);    document.addEventListener('keyup', e => keys[e.key] = false);    function disparar() {        disparos.push({ x: nave.x + 18, y: nave.y, width: 4, height: 10, speed: 7 });        beep(600, 100);    }    function crearAsteroide() {        const x = Math.random() * (canvas.width - 40);        asteroides.push({ x: x, y: -40, width: 40, height: 40, speed: 1 + nivel * 0.2 });    }    function dibujarNave() {        ctx.fillStyle = 'cyan';        ctx.fillRect(nave.x, nave.y, nave.width, nave.height);    }    function dibujarDisparos() {        ctx.fillStyle = 'yellow';        disparos.forEach(d => ctx.fillRect(d.x, d.y, d.width, d.height));    }    function dibujarAsteroides() {        ctx.fillStyle = 'gray';        asteroides.forEach(a => ctx.fillRect(a.x, a.y, a.width, a.height));    }    function dibujarExplosion(x, y) {        ctx.fillStyle = 'orange';        ctx.beginPath();        ctx.arc(x, y, 15, 0, Math.PI * 2);        ctx.fill();    }    function actualizarJuego() {        if (gameOver) return;        // Mover nave        if (keys['ArrowLeft'] && nave.x > 0) nave.x -= nave.speed;        if (keys['ArrowRight'] && nave.x < canvas.width - nave.width) nave.x += nave.speed;        if (keys[' '] && disparos.length < 5) disparar();        // Mover disparos        disparos.forEach((d, i) => {            d.y -= d.speed;            if (d.y < 0) disparos.splice(i, 1);        });        // Mover asteroides        asteroides.forEach((a, i) => {            a.y += a.speed;            if (a.y > canvas.height) {                gameOver = true; // pierdes si el asteroide toca el suelo            }        });        // Colisiones disparo-asteroide        disparos.forEach((d, di) => {            asteroides.forEach((a, ai) => {                if (d.x < a.x + a.width && d.x + d.width > a.x &&                    d.y < a.y + a.height && d.y + d.height > a.y) {                    dibujarExplosion(a.x + a.width/2, a.y + a.height/2);                    asteroides.splice(ai, 1);                    disparos.splice(di, 1);                    score += 10;                    if (score % 50 === 0) nivel += 1;                }            });        });        // Crear nuevos asteroides        if (Math.random() < 0.02 + nivel*0.005) crearAsteroide();        document.getElementById('scoreboard').textContent = `Puntuación: ${score} | Nivel: ${nivel}`;    }    function dibujarJuego() {        ctx.clearRect(0, 0, canvas.width, canvas.height);        dibujarNave();        dibujarDisparos();        dibujarAsteroides();        if (gameOver) {            ctx.fillStyle = 'white';            ctx.font = '30px sans-serif';            ctx.fillText('¡GAME OVER!', 100, 300);        }    }    function bucleJuego() {        actualizarJuego();        dibujarJuego();        requestAnimationFrame(bucleJuego);    }    bucleJuego();</script></body></html>
