<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Escapa del Monstruo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        canvas {
            display: block;
            margin: auto;
            background: #333;
        }
        #startButton {
            padding: 20px;
            font-size: 24px;
            background-color: #0f0;
            border: none;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
<link rel="stylesheet" href="../assets/navigation.css">
</head>
<body>
<a class="invernot-home" href="../index.html" aria-label="Volver al índice de la Familia Invernot">← Volver al inicio</a>


<h1>¡Escapa del Monstruo!</h1>
<button id="startButton">Empezar Juego</button>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<audio id="startSound" src="https://cdn.pixabay.com/audio/2022/10/05/audio_c8ce70313d.mp3"></audio>
<audio id="gameOverSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_e7cbfd85fc.mp3"></audio>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startButton = document.getElementById("startButton");
    const startSound = document.getElementById("startSound");
    const gameOverSound = document.getElementById("gameOverSound");

    let player = { x: 400, y: 300, size: 20 };
    let enemies = [];
    let score = 0;
    let isGameOver = false;
    let gameStarted = false;

    function createEnemy() {
        const size = 30;
        let x, y;

        // Posiciones aleatorias en los bordes
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? 0 : canvas.width;
            y = Math.random() * canvas.height;
        } else {
            x = Math.random() * canvas.width;
            y = Math.random() < 0.5 ? 0 : canvas.height;
        }

        enemies.push({ x, y, size, speed: 1 + Math.random() * 2 });
    }

    function moveEnemies() {
        enemies.forEach(enemy => {
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            enemy.x += (dx / dist) * enemy.speed;
            enemy.y += (dy / dist) * enemy.speed;
        });
    }

    function drawPlayer() {
        ctx.fillStyle = "#0f0";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawEnemies() {
        ctx.fillStyle = "#f00";
        enemies.forEach(enemy => {
            ctx.fillRect(enemy.x - enemy.size / 2, enemy.y - enemy.size / 2, enemy.size, enemy.size);
        });
    }

    function checkCollisions() {
        enemies.forEach(enemy => {
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < player.size + enemy.size / 2) {
                endGame();
            }
        });
    }

    function drawScore() {
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText("Tiempo: " + Math.floor(score / 60) + "s", 10, 30);
    }

    function endGame() {
        isGameOver = true;
        gameOverSound.play();
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("¡Has perdido! Tiempo: " + Math.floor(score / 60) + "s", 150, 300);
    }

    function gameLoop() {
        if (!isGameOver && gameStarted) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            moveEnemies();
            drawPlayer();
            drawEnemies();
            checkCollisions();
            drawScore();
            score++;
            if (score % 120 === 0) { // Cada 2 segundos
                createEnemy();
            }
            requestAnimationFrame(gameLoop);
        }
    }

    function movePlayerTo(x, y) {
        player.x = x;
        player.y = y;
    }

    canvas.addEventListener("touchmove", e => {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        movePlayerTo(touch.clientX - rect.left, touch.clientY - rect.top);
        e.preventDefault();
    });

    canvas.addEventListener("mousemove", e => {
        const rect = canvas.getBoundingClientRect();
        movePlayerTo(e.clientX - rect.left, e.clientY - rect.top);
    });

    startButton.addEventListener("click", () => {
        enemies = [];
        player = { x: 400, y: 300, size: 20 };
        score = 0;
        isGameOver = false;
        gameStarted = true;
        startSound.play();
        startButton.style.display = "none";
        gameLoop();
    });
</script>

</body>
</html>
